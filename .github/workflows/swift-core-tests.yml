name: Swift Core Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-15-intel
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run Swift tests
        shell: bash
        run: |
          set +e
          swift test --parallel 2>&1 | tee swift-test.log
          status=${PIPESTATUS[0]}
          {
            echo "## Swift test result"
            echo
            echo "Exit code: ${status}"
            echo
            echo '```text'
            tail -n 500 swift-test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${status}"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-core-test-logs
          path: |
            .build/**/*.log
            .build/**/*.txt
            swift-test.log
          if-no-files-found: ignore

      - name: Publish compiler failure report
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci
          {
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Commit: ${GITHUB_SHA}"
            echo
            grep -nE 'error:|fatal error:|FAILED|failed|warning:' swift-test.log \
              | tail -n 500 \
              || true
          } > ci/last-swift-test.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/last-swift-test.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Swift CI failure report [skip ci]"
          git push
