name: Swift Core Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run Swift tests
        shell: bash
        run: |
          set +e
          swift test --parallel 2>&1 | tee swift-test.log
          status=${PIPESTATUS[0]}
          {
            echo "## Swift test result"
            echo
            echo "Exit code: ${status}"
            echo
            echo '```text'
            tail -n 500 swift-test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${status}"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-core-test-logs
          path: |
            .build/**/*.log
            .build/**/*.txt
            swift-test.log
          if-no-files-found: ignore
